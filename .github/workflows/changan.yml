name: Build DiPlay (Changan UNI-T)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Changan UNI-T patches
        run: |
          cat > common/src/main/java/com/shilapi/xcertplay/BrandDetector.kt << 'KEOF'
          package com.shilapi.xcertplay

          import android.os.Build
          import android.util.Log

          object BrandDetector {
              private const val TAG = "BrandDetector"
              private var cached: Boolean? = null

              fun isBydHeadUnit(): Boolean {
                  cached?.let { return it }
                  val fp = Build.FINGERPRINT ?: ""
                  val mfr = Build.MANUFACTURER ?: ""
                  val r = fp.contains("BYD", true) || fp.contains("xdja", true) ||
                          fp.contains("containerservice", true) || mfr.contains("BYD", true)
                  Log.i(TAG, "isBYD=$r fp=$fp mfr=$mfr")
                  cached = r
                  return r
              }
          }
          KEOF

python3 <<<
python3 <<<'PYEOF'

