with open(f) as fh: c = fh.read()
if "BrandDetector" in c: return
c = c.replace("package com.shilapi.xcertplay", "
"package com.shilapi.xcertplay\n\nimport com.shilapi.xcertplay.BrandDetector", 1)
with open(f, "w") as fh: fh.write(c)

def guard_supported(f):
if not os.path.isfile(f): return
              add_import(f)
