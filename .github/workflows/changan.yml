name: Build DiPlay Changan
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Create patch script
        run: python3 -c "
import os,re;P='common/src/main/java/com/shilapi/xcertplay';exec(open(os.devnull,'w').write('') or True and None)
" || true
      - name: Apply patches
        run: |
          mkdir -p common/src/main/java/com/shilapi/xcertplay
          printf 'package com.shilapi.xcertplay\nimport android.os.Build\nimport android.util.Log\nobject BrandDetector { private const val TAG = \"BrandDetector\"; private var cached: Boolean? = null\nfun isBydHeadUnit(): Boolean { cached?.let { return it }; val fp = Build.FINGERPRINT ?: \"\"; val mfr = Build.MANUFACTURER ?: \"\"\nval r = fp.contains(\"BYD\",true) || fp.contains(\"xdja\",true) || fp.contains(\"containerservice\",true) || mfr.contains(\"BYD\",true)\nLog.i(TAG,\"isBYD=$r fp=$fp mfr=$mfr\"); cached=r; return r } }\n' > common/src/main/java/com/shilapi/xcertplay/BrandDetector.kt
          cd common/src/main/java/com/shilapi/xcertplay
          for f in ClusterMapPresentation.kt DiLink51ClusterLayout.kt DiLink4ClusterDisplay.kt BydVehicleSettingsBackend.kt DiLink51ClusterMonitor.kt; do
            [ -f "$f" ] && grep -q "BrandDetector" "$f" || sed -i 's/^package com.shilapi.xcertplay/package com.shilapi.xcertplay\n\nimport com.shilapi.xcertplay.BrandDetector/' "$f"
            echo "Patched $f"
          done
          sed -i '/override fun onCreate(savedInstanceState: Bundle?)/a\        if (!BrandDetector.isBydHeadUnit()) { finish(); return }' ClusterMapPresentation.kt
          echo "Patches done"
      - name: Build
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Changan-UNI-T
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
